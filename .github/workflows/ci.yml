name: Orchpact PostgreSQL
on: [push, pull_request]
permissions:
  contents: read
jobs:
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/check_commits.py --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Check pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/check_commits.py --subject "$PR_TITLE"
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      ORCHPACT_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      ORCHPACT_PG_DUMP: /usr/lib/postgresql/18/bin/pg_dump
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PostgreSQL backup client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
      - run: uv sync --frozen
      - run: uv run python -m unittest discover -s tests -p 'test_*.py'
      - run: node --test tests/*.test.cjs
      - run: uv run python evals/run.py --output /tmp/orchpact-eval.json
      - run: uv run python evals/verify_contracts.py --output /tmp/orchpact-contracts.json
      - run: uv run python examples/verified-delivery.py --output /tmp/orchpact-delivery-demo.json
      - run: uv run python examples/fulfillment/run.py --output /tmp/orchpact-fulfillment-demo.json
      - run: uv run python examples/mystery-story/run.py --output /tmp/orchpact-mystery-demo.json
      - run: uv run python examples/mystery-story/run.py --case await-human --simulate-approval --output /tmp/orchpact-mystery-approved.json
      - run: uv run python scripts/smoke_release.py --output /tmp/orchpact-smoke.json
      - run: uv build
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare private standalone configuration
        run: |
          python3 docker/configure.py --output /tmp/orchpact-compose.env
          python3 - <<'PY'
          from pathlib import Path
          with Path('/tmp/orchpact-compose.env').open('a') as stream:
              stream.write('ORCHPACT_IMAGE=orchpact-standalone:ci\n')
          PY
      - name: Build only this repository
        run: docker build -t orchpact-standalone:ci .
      - name: Start isolated runtime and PostgreSQL
        run: |
          docker compose --env-file /tmp/orchpact-compose.env -p orchpact-ci config --quiet
          docker compose --env-file /tmp/orchpact-compose.env -p orchpact-ci up -d --no-build --wait --wait-timeout 120
          curl --fail --silent http://127.0.0.1:8780/readyz
      - name: Stop temporary services
        if: always()
        run: |
          docker compose --env-file /tmp/orchpact-compose.env -p orchpact-ci stop
          docker compose --env-file /tmp/orchpact-compose.env -p orchpact-ci rm -f

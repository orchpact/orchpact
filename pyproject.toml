[project]
name = "orchpact"
version = "0.1.0"
description = "Self-hosted organization collaboration workflow engine"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.10,<3",
    "httpx>=0.28,<1",
    "filelock>=3.16,<5",
    "python-dotenv>=1,<2",
    "jsonschema>=4.23,<5",
    "cryptography>=44,<49",
    "psycopg[binary]>=3.2,<4",
    "crewai>=1.15.41,<1.16",
]
[project.urls]
Homepage = "https://orchpact.github.io/"
Documentation = "https://orchpact.github.io/docs/"
Repository = "https://github.com/orchpact/orchpact"
Issues = "https://github.com/orchpact/orchpact/issues"

[project.scripts]
orchpact = "orchpact.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/orchpact"]

[tool.hatch.build.targets.wheel.force-include]
"examples/fulfillment/input.json" = "orchpact/scenarios/assets/fulfillment/input.json"
"examples/fulfillment/workflow.json" = "orchpact/scenarios/assets/fulfillment/workflow.json"
"examples/mystery-story/input.json" = "orchpact/scenarios/assets/mystery-story/input.json"
"examples/mystery-story/workflow.json" = "orchpact/scenarios/assets/mystery-story/workflow.json"

[tool.hatch.build.targets.sdist]
exclude = ["/artifacts/"]
include = ["/Dockerfile", "/.dockerignore", "/compose.yaml", "/docker/*.py", "/docker/*.sql", "/src/", "/tests/", "/AGENTS.md", "/scripts/", "/.githooks/", "/frontend/src/", "/frontend/licenses/", "/frontend/*.json", "/frontend/build.mjs", "/frontend/LICENSE-shadcn.txt", "/design/identity/", "/release/", "/config/", "/examples/", "/contracts/", "/evals/", "/LICENSE", "/THIRD_PARTY.md", "/README.md", "/README.en.md", "/CONTRIBUTING.md", "/SECURITY.md", "/.github/workflows/", "/pyproject.toml", "/uv.lock", "/.env.example", "/.gitattributes", "/.gitignore"]

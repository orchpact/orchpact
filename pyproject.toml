[project]
name = "orchpact"
version = "0.1.0"
description = "Self-hosted organization collaboration workflow engine"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.10,<3",
    "httpx>=0.28,<1",
    "filelock>=3.16,<5",
    "python-dotenv>=1,<2",
    "jsonschema>=4.23,<5",
    "cryptography>=44,<49",
    "psycopg[binary]>=3.2,<4",
    "crewai>=1.15.41,<1.16",
]
[project.urls]
Homepage = "https://orchpact.github.io/"
Documentation = "https://orchpact.github.io/docs/"
Repository = "https://github.com/orchpact/orchpact"
Issues = "https://github.com/orchpact/orchpact/issues"

[project.scripts]
orchpact = "orchpact.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/orchpact"]

[tool.hatch.build.targets.sdist]
exclude = ["/artifacts/", "/docs/search-live-*.json", "/docs/workspace.png", "/docs/images/*.png"]
include = ["/Dockerfile", "/.dockerignore", "/compose.yaml", "/docker/*.py", "/docker/*.sql", "/docker/README.md", "/src/", "/tests/", "/AGENTS.md", "/docs/GETTING_STARTED.md", "/docs/REPOSITORIES.md", "/docs/ARCHITECTURE.md", "/docs/EXECUTION_BOUNDARY.md", "/docs/TEAM_EXECUTION.md", "/docs/APPLICATIONS.md", "/docs/WORKSPACES.md", "/docs/PROVIDERS.md", "/docs/POSTGRESQL.md", "/docs/CONSOLE.md", "/docs/SHOWCASE.md", "/docs/WORKFLOWS.md", "/docs/COMPATIBILITY.md", "/docs/NAMING.md", "/docs/RELEASE_VALIDATION.md", "/scripts/", "/.githooks/", "/release/", "/config/", "/examples/", "/contracts/", "/evals/", "/LICENSE", "/THIRD_PARTY.md", "/README.md", "/README.en.md", "/CONTRIBUTING.md", "/SECURITY.md", "/.github/workflows/", "/pyproject.toml", "/uv.lock", "/.env.example", "/.gitignore"]

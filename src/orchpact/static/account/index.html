<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>登录 Orchpact</title>
  <link rel="icon" href="/static/brand/favicon.ico" sizes="any">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/brand/apple-touch-icon.png">
  <script src="/static/appearance.js"></script>
  <link rel="stylesheet" href="/static/brand/identity-tokens.css">
  <link rel="stylesheet" href="/static/appearance.css">
  <link rel="stylesheet" href="/static/ui/admin.css">
  <link rel="stylesheet" href="/static/kernel/style.css">
  <link rel="stylesheet" href="/static/account/entry.css">
</head>
<body class="account-login-page">
  <a class="skip-link" href="#account-login">跳到主要内容</a>
  <div class="entry-page">
    <header class="entry-mast">
      <a href="https://orchpact.github.io/" aria-label="Orchpact 官网">
        <span class="app-wordmark">
        <img data-wordmark="light" src="/static/brand/orchpact-logo.svg" width="322" height="80" alt="Orchpact">
        <img data-wordmark="dark" src="/static/brand/orchpact-logo-dark.svg" width="322" height="80" alt="Orchpact">
      </span>
      </a>
      <span>自托管工作台</span>
    </header>
    <main id="account-login" class="entry-main" tabindex="-1" aria-busy="true">
      <section class="entry-card" aria-labelledby="login-title">
        <div id="login-controls"><h1 id="login-title">登录工作台</h1><p class="entry-hint">正在读取实例状态…</p></div>
        <form id="login-form" method="post" action="/api/v1/auth/login" hidden>
          <label class="entry-label" for="entry-username">账号</label>
          <input id="entry-username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" minlength="3" maxlength="64" pattern="[a-zA-Z0-9][a-zA-Z0-9_.\-]{2,63}" required>
          <div id="login-fields"></div>
          <div id="login-action"></div>
        </form>
        <div id="login-feedback" aria-live="polite"></div>
        <noscript>登录工作台需要启用 JavaScript。</noscript>
      </section>
    </main>
    <footer class="entry-project">
      <span>开源自托管工作流引擎</span>
      <nav aria-label="项目资料">
        <a href="https://orchpact.github.io/">项目官网</a>
        <a href="https://orchpact.github.io/docs/">使用文档</a>
        <a href="https://github.com/orchpact/orchpact">GitHub</a>
      </nav>
    </footer>
  </div>
  <script type="module" src="/static/ui/login.js"></script>
</body>
</html>

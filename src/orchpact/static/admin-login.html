<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>管理登录 · Orchpact</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/kernel/style.css">
</head>
<body class="login-page">
  <header class="console-bar glass">
    <a class="brand" href="/"><img src="/static/brand/orchpact-icon.svg" width="36" height="36" alt=""><span>Orchpact</span></a>
    <a class="action-link" href="/account/">个人账号 ↗</a>
  </header>
  <main class="login-main">
    <section class="login-surface" aria-labelledby="login-title">
      <img src="/static/brand/orchpact-icon.svg" width="66" height="66" alt="">
      <h1 id="login-title">管理登录</h1>
      <p class="muted">验证管理凭据后，即可进入 Orchpact 后台。</p>
      <form id="admin-login">
        <label for="admin-token">API Token</label>
        <input id="admin-token" name="token" type="password" required autocomplete="off" maxlength="4096" aria-describedby="login-hint">
        <p id="login-hint" class="muted">对应服务器配置中的 <code>ORCHPACT_API_TOKEN</code>。登录后会话有效期为 12 小时。</p>
        <button type="submit" class="primary">验证并进入</button>
        <p id="login-error" class="error" role="alert"></p>
      </form>
    </section>
  </main>
  <script src="/static/admin-login.js"></script>
</body>
</html>
